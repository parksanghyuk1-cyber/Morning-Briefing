name: Credit Balance Chart

on:
  # 실행: cron-job.org가 평일 16:30 KST에 workflow_dispatch 호출
  # (GitHub schedule은 몇 시간씩 늦게 돌아서 2026-11-28에 뺌)
  workflow_dispatch:
    inputs:
      force:
        description: '주말·공휴일에도 발송'
        type: boolean
        default: false

jobs:
  credit_balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Korean font
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright openpyxl matplotlib

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run credit balance capture
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND:       ${{ inputs.force }}
        run: python credit_balance.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 신용잔고 차트 전송 실패."
