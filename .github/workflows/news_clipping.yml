name: 뉴스 클리핑

on:
  # 실행: cron-job.org가 평일 07:30 KST에 workflow_dispatch 호출
  workflow_dispatch:
    inputs:
      force:
        description: '주말·공휴일에도 발송'
        type: boolean
        default: false

concurrency:
  group: news-clipping
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install --quiet requests holidays google-genai trafilatura

      - name: 클리핑 만들고 텔레그램 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_SEND: ${{ inputs.force }}
          TZ: Asia/Seoul
        run: python news_clipping.py
